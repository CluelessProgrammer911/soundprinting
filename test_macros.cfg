[gcode_macro TEST_BASIC]
description: "Very basic sanity check"
gcode:
  M115
  G28

[gcode_macro TEST_ECHO]
description: "Tiny Jinja echo test"
gcode:
  RESPOND PREFIX=test MSG="{ 'echo %d' % 123 }"


[gcode_macro TEST_POS]
description: "Report current X position via Jinja"
gcode:
  RESPOND PREFIX=test MSG="{ 'X=%.3f' % (printer.toolhead.position.x|float) }"

[gcode_macro TEST_PARAMS]
description: "Echo parsed params to verify Jinja parameter handling"
gcode:
  {% set dir  = params.DIR|default(1)|int %}
  {% set step = params.STEP|default(0.5)|float %}
  RESPOND PREFIX=test MSG="{ 'DIR=%+d STEP=%.3f' % (dir, step) }"

[gcode_macro JOGX_STEP_SIMPLE]
description: "One safe X step within [50,100] using only local constants. Usage: JOGX_STEP_SIMPLE [DIR=1|-1] [STEP=<mm>]"
gcode:
  # Read params with safe defaults (no macro variables used)
  {% set dir  = params.DIR|default(1)|int %}
  {% if dir != 1 and dir != -1 %}{% set dir = 1 %}{% endif %}
  {% set step = params.STEP|default(0.5)|float %}

  # Local constants for bounds
  {% set xmin = 50.0 %}
  {% set xmax = 100.0 %}
  {% set eps  = 1e-6 %}

  # Current X
  {% set x = printer.toolhead.position.x|float %}

  # Proposed/clamped step
  {% set proposed = x + dir * step %}
  {% if proposed > xmax %}
    {% set dx = xmax - x %}
  {% elif proposed < xmin %}
    {% set dx = xmin - x %}
  {% else %}
    {% set dx = dir * step %}
  {% endif %}

  # Move if non-zero
  {% if dx|abs > eps %}
    G91
    G1 X{ "%.6f" % dx } F1200
    G90
    RESPOND PREFIX=jogx MSG="{ 'X=%.3f, dx=%.3f, DIR=%+d' % (x, dx, dir) }"
  {% else %}
    RESPOND PREFIX=jogx MSG="{ 'at bound (X=%.3f), no move' % x }"
  {% endif %}

[gcode_macro TEST_STATE]
description: "Holds vars for testing; empty gcode block"
variable_dir: 1
variable_step: 0.5
gcode:

[gcode_macro TEST_GET_BLEH]
description: "Read variables defined on this macro (correct attribute names)"
variable_dir: 1
variable_step: 0.5
gcode:
  {% set dir  = printer["gcode_macro TEST_GET_BLEH"].dir|int %}
  {% set step = printer["gcode_macro TEST_GET_BLEH"].step|float %}
  RESPOND PREFIX=test MSG="{ 'DIR=%+d STEP=%.3f' % (dir, step) }"

[gcode_macro JOGX_STATE_MIN]
description: "Minimal state holder for X jog (direction & step)"
variable_dir: 1          # +1 or -1
variable_step: 0.5       # mm
gcode:

[gcode_macro TEST_STATE]
description: "Echo minimal jog state to verify variable access"
gcode:
  {% set d = printer["gcode_macro JOGX_STATE_MIN"].dir|int %}
  {% set s = printer["gcode_macro JOGX_STATE_MIN"].step|float %}
  RESPOND PREFIX=test MSG="{ 'dir=%+d step=%.3f' % (d, s) }"

[gcode_macro JOGX_STEP_STATEFUL]
description: "One bounded X step using state (dir/step), bouncing at [50,100]"
gcode:
  # --- Read state ---
  {% set dir  = printer["gcode_macro JOGX_STATE_MIN"].dir|int %}
  {% set step = printer["gcode_macro JOGX_STATE_MIN"].step|float %}

  # Sanitize dir
  {% if dir != 1 and dir != -1 %}{% set dir = 1 %}{% endif %}

  # --- Bounds / epsilon (constants for now) ---
  {% set xmin = 50.0 %}
  {% set xmax = 100.0 %}
  {% set eps  = 1e-6 %}

  # --- Current X ---
  {% set x = printer.toolhead.position.x|float %}

  # If we're at/beyond a bound and heading outward, flip direction before stepping
  {% if x <= xmin and dir < 0 %}{% set dir = 1 %}{% endif %}
  {% if x >= xmax and dir > 0 %}{% set dir = -1 %}{% endif %}

  # Compute proposed step and clamp to bounds
  {% set proposed = x + dir * step %}
  {% if proposed > xmax %}
    {% set dx = xmax - x %}
    {% set dir = -1 %}
  {% elif proposed < xmin %}
    {% set dx = xmin - x %}
    {% set dir = 1 %}
  {% else %}
    {% set dx = dir * step %}
  {% endif %}

  # --- Execute move if non-zero ---
  {% if dx|abs > eps %}
    G91
    G1 X{ "%.6f" % dx } F1200
    G90
    RESPOND PREFIX=jogx MSG="{ 'X=%.3f, dx=%.3f, dir->%+d' % (x, dx, dir) }"
  {% else %}
    RESPOND PREFIX=jogx MSG="{ 'at bound (X=%.3f), no move' % x }"
  {% endif %}

  # Persist possibly updated direction (for bounce)
  SET_GCODE_VARIABLE MACRO=JOGX_STATE_MIN VARIABLE=dir VALUE={dir}