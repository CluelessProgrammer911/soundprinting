[gcode_macro JOGX_STATE]
description: "X jog state (dir/step, velocity, tick, bounds)"
# Direction (+1 / -1)
variable_dir: 1
# Step size in mm per tick (derived from v*dt by JOGX_V)
variable_step: 0.5
# Velocity in mm/s (signed). JOGX_V sets this and step.
variable_v: 0.0
# Tick interval in seconds (20 ms by default)
variable_dt: 0.02
# Bounds for test window (safe)
variable_xmin: 50.0
variable_xmax: 100.0
# Max allowed |v| (mm/s) for safety
variable_v_max: 100.0
# Default feedrate for small steps (mm/min), added on top of v-based F
variable_feed: 1200.0
# Internal epsilon
variable_eps: 1e-6
# Loop running flag (0/1)
variable_running: 0
gcode:

[gcode_macro TEST_STATE]
description: "Echo X jog state"
gcode:
  {% set s = printer["gcode_macro JOGX_STATE"] %}
  RESPOND PREFIX=test MSG="{ 'dir=%+d step=%.4f v=%.3f dt=%.3f xmin=%.3f xmax=%.3f run=%d' % (s.dir|int, s.step|float, s.v|float, s.dt|float, s.xmin|float, s.xmax|float, s.running|int) }"

# ---- Step B: single bounded step using state, with hard bounce ----
[gcode_macro JOGX_STEP_STATEFUL]
description: "One bounded X step using state (dir/step), hard-bounce at [xmin,xmax]"
gcode:
  {% set st   = printer["gcode_macro JOGX_STATE"] %}
  {% set dir  = st.dir|int %}
  {% set step = st.step|float %}
  {% if dir != 1 and dir != -1 %}{% set dir = 1 %}{% endif %}

  {% set xmin = st.xmin|float %}
  {% set xmax = st.xmax|float %}
  {% set eps  = st.eps|float if st.eps is defined else 1e-6 %}
  {% set feed = st.feed|float if st.feed is defined else 1200.0 %}
  {% set vabs = (st.v|float)|abs %}

  {% set x = printer.toolhead.position.x|float %}

  # If at/beyond bound and heading outward, flip before step
  {% if x <= xmin and dir < 0 %}{% set dir = 1 %}{% endif %}
  {% if x >= xmax and dir > 0 %}{% set dir = -1 %}{% endif %}

  # Proposed step and clamp
  {% set proposed = x + dir * step %}
  {% if proposed > xmax %}
    {% set dx = xmax - x %}
    {% set dir = -1 %}
  {% elif proposed < xmin %}
    {% set dx = xmin - x %}
    {% set dir = 1 %}
  {% else %}
    {% set dx = dir * step %}
  {% endif %}

  {% if dx|abs > eps %}
    G91
    # Compute a reasonable F based on |v|; ensure not near-zero
    {% set F = (vabs * 60.0) + feed %}
    G1 X{ "%.6f" % dx } F{ "%.1f" % F }
    G90
    RESPOND PREFIX=jogx MSG="{ 'X=%.3f, dx=%.3f, dir->%+d' % (x, dx, dir) }"
  {% else %}
    RESPOND PREFIX=jogx MSG="{ 'at bound (X=%.3f), no move' % x }"
  {% endif %}

  # Persist possibly updated dir (bounce)
  SET_GCODE_VARIABLE MACRO=JOGX_STATE VARIABLE=dir VALUE={dir}

# ---- Helper: set velocity (mm/s), update step = |v|*dt, set dir from sign, optionally (re)start loop ----
[gcode_macro JOGX_V]
description: "Set X jog velocity V=<mm/s>; updates step=v*dt, dir=sign(V). V=0 stops motion but not the loop."
# Usage:
#   JOGX_V V=20      ; move +X at ~20 mm/s (bounded)
#   JOGX_V V=-10     ; move -X at ~10 mm/s (bounded)
#   JOGX_V V=0       ; stop motion (step=0)
gcode:
  {% set st   = printer["gcode_macro JOGX_STATE"] %}
  {% set vmax = st.v_max|float %}
  {% set dt   = st.dt|float %}
  {% set vreq = params.V|default(0)|float %}
  # Clamp v for safety
  {% if vreq >  vmax %}{% set vreq =  vmax %}{% elif vreq < -vmax %}{% set vreq = -vmax %}{% endif %}
  # Derive step and dir from v
  {% set step = (vreq|abs) * dt %}
  {% set dir  = 1 if vreq >= 0 else -1 %}
  SET_GCODE_VARIABLE MACRO=JOGX_STATE VARIABLE=v VALUE={ "%.6f" % vreq }
  SET_GCODE_VARIABLE MACRO=JOGX_STATE VARIABLE=step VALUE={ "%.6f" % step }
  SET_GCODE_VARIABLE MACRO=JOGX_STATE VARIABLE=dir VALUE={dir}
  RESPOND PREFIX=jogx MSG="{ 'set v=%.3f mm/s -> step=%.4f (dt=%.3f) dir=%+d' % (vreq, step, dt, dir) }"

# ---- Loop control: start/stop and the timer itself ----
[gcode_macro JOGX_START]
description: "Start the X jog loop (uses current dt and state); does not set velocity"
gcode:
  SET_GCODE_VARIABLE MACRO=JOGX_STATE VARIABLE=running VALUE=1
  UPDATE_DELAYED_GCODE ID=JOGX_LOOP DURATION={ printer["gcode_macro JOGX_STATE"].dt }
  RESPOND PREFIX=jogx MSG="loop started"

[gcode_macro JOGX_STOP]
description: "Stop the X jog loop and zero velocity/step"
gcode:
  UPDATE_DELAYED_GCODE ID=JOGX_LOOP DURATION=0
  SET_GCODE_VARIABLE MACRO=JOGX_STATE VARIABLE=running VALUE=0
  SET_GCODE_VARIABLE MACRO=JOGX_STATE VARIABLE=v VALUE=0
  SET_GCODE_VARIABLE MACRO=JOGX_STATE VARIABLE=step VALUE=0
  RESPOND PREFIX=jogx MSG="loop stopped"

[delayed_gcode JOGX_LOOP]
gcode:
  {% set st = printer["gcode_macro JOGX_STATE"] %}
  {% if (st.running|int) == 0 %}
    UPDATE_DELAYED_GCODE ID=JOGX_LOOP DURATION=0
    RESPOND PREFIX=jogx MSG="idle"
  {% else %}
    # Only step if we have a non-zero step (v may be zero)
    {% if (st.step|float)|abs > (st.eps|float if st.eps is defined else 1e-6) %}
      JOGX_STEP_STATEFUL
    {% endif %}
    UPDATE_DELAYED_GCODE ID=JOGX_LOOP DURATION={ st.dt|float }
  {% endif %}