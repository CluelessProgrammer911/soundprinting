[gcode_macro JOGX_STATE]
description: "X jog state (dir/step, velocity, tick, bounds)"
# Direction (+1 / -1)
variable_dir: 1
# Step per tick (mm) -> derived from v*dt
variable_step: 0.5
# Velocity (mm/s), signed
variable_v: 0.0
# Tick interval (s)
variable_dt: 0.02
# Bounds (mm)
variable_xmin: 50.0
variable_xmax: 100.0
# Safety clamp for |v| (mm/s)
variable_v_max: 100.0
# Minimum feed (mm/min) to keep moves valid
variable_feed_min: 120.0
# Internal epsilon
variable_eps: 1e-6
# Loop running flag (0/1)
variable_running: 0
# Generation token (increments on start/stop/change to kill stale ticks)
variable_gen: 0
# Verbose logging (0/1)
variable_verbose: 0
gcode:

[gcode_macro TEST_STATE]
description: "Echo X jog state"
gcode:
  {% set s = printer["gcode_macro JOGX_STATE"] %}
  RESPOND PREFIX=test MSG="{ 'dir=%+d step=%.4f v=%.3f dt=%.3f xmin=%.3f xmax=%.3f run=%d gen=%d verb=%d' % (
    s.dir|int, s.step|float, s.v|float, s.dt|float, s.xmin|float, s.xmax|float, s.running|int, s.gen|int, s.verbose|int) }"

[gcode_macro JOGX_VERBOSE]
description: "Toggle verbose logging: JOGX_VERBOSE ON|OFF"
gcode:
  {% set on = params.ON|default("")|string|upper %}
  {% if on in ["1","ON","TRUE","YES"] %}
    SET_GCODE_VARIABLE MACRO=JOGX_STATE VARIABLE=verbose VALUE=1
    RESPOND PREFIX=jogx MSG="verbose=1"
  {% else %}
    SET_GCODE_VARIABLE MACRO=JOGX_STATE VARIABLE=verbose VALUE=0
    RESPOND PREFIX=jogx MSG="verbose=0"
  {% endif %}

# ---- Core one-step (bounded, with bounce) ----
[gcode_macro JOGX_STEP_STATEFUL]
description: "One bounded X step using state (dir/step), hard-bounce at [xmin,xmax]"
gcode:
  {% set st   = printer["gcode_macro JOGX_STATE"] %}
  {% set dir  = st.dir|int %}
  {% set step = st.step|float %}
  {% if dir != 1 and dir != -1 %}{% set dir = 1 %}{% endif %}

  {% set xmin = st.xmin|float %}
  {% set xmax = st.xmax|float %}
  {% set eps  = st.eps|float %}
  {% set vabs = (st.v|float)|abs %}
  {% set F    = (vabs * 60.0) %}
  {% set F    = F if F >= (st.feed_min|float) else (st.feed_min|float) %}

  {% set x = printer.toolhead.position.x|float %}

  # Pre-bounce alignment if at a bound and heading outward
  {% if x <= xmin and dir < 0 %}{% set dir = 1 %}{% endif %}
  {% if x >= xmax and dir > 0 %}{% set dir = -1 %}{% endif %}

  # Proposed step and clamp
  {% set proposed = x + dir * step %}
  {% if proposed > xmax %}
    {% set dx = xmax - x %}
    {% set dir = -1 %}
  {% elif proposed < xmin %}
    {% set dx = xmin - x %}
    {% set dir = 1 %}
  {% else %}
    {% set dx = dir * step %}
  {% endif %}

  {% if dx|abs > eps %}
    G91
    G1 X{ "%.6f" % dx } F{ "%.1f" % F }
    G90
    {% if st.verbose|int == 1 %}
      RESPOND PREFIX=jogx MSG="{ 'X=%.3f, dx=%.3f, dir->%+d' % (x, dx, dir) }"
    {% endif %}
  {% else %}
    {% if st.verbose|int == 1 %}
      RESPOND PREFIX=jogx MSG="{ 'at bound (X=%.3f), no move' % x }"
    {% endif %}
  {% endif %}

  # Persist possibly updated dir (bounce)
  SET_GCODE_VARIABLE MACRO=JOGX_STATE VARIABLE=dir VALUE={dir}

# ---- Velocity helper: sets v, derives step=v*dt, sets dir=sign(v) ----
[gcode_macro JOGX_V]
description: "Set X jog velocity V=<mm/s>; updates step=v*dt, dir=sign(V). V=0 will also stop the loop."
gcode:
  {% set st   = printer["gcode_macro JOGX_STATE"] %}
  {% set vmax = st.v_max|float %}
  {% set dt   = st.dt|float %}
  {% set vreq = params.V|default(0)|float %}
  # Clamp v for safety
  {% if vreq >  vmax %}{% set vreq =  vmax %}{% elif vreq < -vmax %}{% set vreq = -vmax %}{% endif %}
  {% set step = (vreq|abs) * dt %}
  {% set dir  = 1 if vreq >= 0 else -1 %}
  SET_GCODE_VARIABLE MACRO=JOGX_STATE VARIABLE=v VALUE={ "%.6f" % vreq }
  SET_GCODE_VARIABLE MACRO=JOGX_STATE VARIABLE=step VALUE={ "%.6f" % step }
  SET_GCODE_VARIABLE MACRO=JOGX_STATE VARIABLE=dir VALUE={dir}

  {% if vreq == 0.0 %}
    # Hard stop when V=0: cancel loop and bump gen to kill stale ticks
    {% set newgen = (st.gen|int) + 1 %}
    UPDATE_DELAYED_GCODE ID=JOGX_LOOP DURATION=0
    SET_GCODE_VARIABLE MACRO=JOGX_STATE VARIABLE=running VALUE=0
    SET_GCODE_VARIABLE MACRO=JOGX_STATE VARIABLE=gen VALUE={newgen}
    RESPOND PREFIX=jogx MSG="v=0 -> motion stopped, loop cancelled"
  {% else %}
    RESPOND PREFIX=jogx MSG="{ 'set v=%.3f mm/s -> step=%.4f (dt=%.3f) dir=%+d' % (vreq, step, dt, dir) }"
  {% endif %}

# ---- Loop control with generation guard ----
[gcode_macro JOGX_START]
description: "Start the X jog loop (will only move if v!=0)"
gcode:
  {% set st = printer["gcode_macro JOGX_STATE"] %}
  {% set newgen = (st.gen|int) + 1 %}
  SET_GCODE_VARIABLE MACRO=JOGX_STATE VARIABLE=running VALUE=1
  SET_GCODE_VARIABLE MACRO=JOGX_STATE VARIABLE=gen VALUE={newgen}
  UPDATE_DELAYED_GCODE ID=JOGX_LOOP DURATION={ st.dt|float }
  RESPOND PREFIX=jogx MSG="loop started (gen={newgen})"

[gcode_macro JOGX_STOP]
description: "Stop the X jog loop and zero velocity/step (hard cancel)"
gcode:
  {% set st = printer["gcode_macro JOGX_STATE"] %}
  {% set newgen = (st.gen|int) + 1 %}
  UPDATE_DELAYED_GCODE ID=JOGX_LOOP DURATION=0
  SET_GCODE_VARIABLE MACRO=JOGX_STATE VARIABLE=running VALUE=0
  SET_GCODE_VARIABLE MACRO=JOGX_STATE VARIABLE=v VALUE=0
  SET_GCODE_VARIABLE MACRO=JOGX_STATE VARIABLE=step VALUE=0
  SET_GCODE_VARIABLE MACRO=JOGX_STATE VARIABLE=gen VALUE={newgen}
  RESPOND PREFIX=jogx MSG="loop stopped (gen={newgen})"

[delayed_gcode JOGX_LOOP]
gcode:
  {% set st = printer["gcode_macro JOGX_STATE"] %}
  {% set g  = st.gen|int %}
  {% set eps = st.eps|float %}
  {% set do_move = (st.step|float)|abs > eps and (st.v|float)|abs > 0.0 %}
  {% if (st.running|int) != 1 %}
    # Not running: ensure cancelled and don't reschedule
    UPDATE_DELAYED_GCODE ID=JOGX_LOOP DURATION=0
    {% if st.verbose|int == 1 %}RESPOND PREFIX=jogx MSG="idle"{% endif %}
  {% else %}
    # Perform one step only if v and step are non-zero
    {% if do_move %} JOGX_STEP_STATEFUL {% endif %}
    # Re-check generation before rescheduling (kill stale ticks)
    {% if g != (printer["gcode_macro JOGX_STATE"].gen|int) %}
      UPDATE_DELAYED_GCODE ID=JOGX_LOOP DURATION=0
    {% else %}
      UPDATE_DELAYED_GCODE ID=JOGX_LOOP DURATION={ st.dt|float }
    {% endif %}
  {% endif %}